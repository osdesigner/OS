<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>kacher</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="app-container">
        <div class="offline-banner" id="offlineBanner" style="display: none;">
            <i class="fas fa-wifi"></i> وضع الأوفلاين - الفواتير مخزنة محلياً سيتم مزامنتها تلقائياً
        </div>
        <div class="sync-progress" id="syncProgress">
            <i class="fas fa-sync-alt fa-spin"></i> جاري المزامنة مع Firebase...
        </div>

        
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-store"></i> براند فون</h1>
            </div>

                    <div class="data">
            <div id="dateNow"></div>
        </div>
            <div class="status-badge">
                <div class="online-status" id="statusDot"></div>
                <span id="statusText">متصل</span>
                <span class="badge" id="pendingCount" style="background: #f39c12; display: none;">0</span>
                <button class="sync-btn" onclick="manualSync()" id="syncBtn">
                    <i class="fas fa-sync-alt"></i> مزامنة
                </button>
            </div>
        </div>



        <div class="main-content">
            <div class="search-section">
                <div class="section-title">
                    <i class="fas fa-search"></i>
                    البحث عن منتج
                </div>
                
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الباركود...">
                    </div>
                    <div class="suggestions-box" id="suggestionsBox"></div>
                </div>

                <div class="section-title" style="margin-top: 20px;">
                    <i class="fas fa-list-ul"></i>
                    المنتجات المضافة
                </div>
                <div class="selected-products" id="selectedProducts">
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <p>لم يتم إضافة أي منتج</p>
                    </div>
                </div>
            </div>

            <div class="cart-section">

 <div class="section-title">
        <i class="fas fa-user"></i>
        بيانات العميل
    </div>

                <div class="customer-data">
                
                    <input type="text"
                    id="customerName"
                    placeholder="اسم العميل">
                
                    <input type="tel"
                    id="customerPhone"
                    placeholder="رقم واتساب العميل">
                
                </div>

                <div class="section-title">
                    <i class="fas fa-shopping-cart"></i>
                    سلة المشتريات
                </div>
                <div class="cart-items" id="cartItems">
                    <div class="empty-state">
                        <i class="fas fa-shopping-basket"></i>
                        <p>السلة فارغة</p>
                    </div>
                </div>

                <div class="payment-section">
                    <div style="font-weight: 800; margin-bottom: 15px;">
                        <i class="fas fa-money-bill-wave"></i> طريقة الدفع
                    </div>
                    <div class="payment-options">
                        <div class="payment-option selected" data-payment="cash" onclick="selectPayment('cash')">
                            <div><i class="fas fa-money-bill"></i> كاش</div>
                        </div>
                        <div class="payment-option" data-payment="vodafone" onclick="selectPayment('vodafone')">
                            <div><i class="fas fa-mobile-alt"></i> فودافون كاش</div>
                        </div>
                        <div class="payment-option" data-payment="mixed" onclick="selectPayment('mixed')">
                            <div><i class="fas fa-random"></i> مختلط</div>
                        </div>
                    </div>

                    <div class="mixed-payment-details" id="mixedPaymentDetails">
                        <div class="mixed-input">
                            <label>كاش:</label>
                            <input type="number" id="cashAmount" placeholder="0" value="0" oninput="updateMixedPayment()">
                        </div>
                        <div class="mixed-input">
                            <label>فودافون كاش:</label>
                            <input type="number" id="vodafoneAmount" placeholder="0" value="0" oninput="updateMixedPayment()">
                        </div>
                        <div id="mixedError" style="font-size: 0.8rem; color: #dc3545;"></div>
                    </div>
                </div>

                <div class="cart-total">
                    <div class="total-row">
                        <span>المجموع:</span>
                        <span id="subtotal">0 ج.م</span>
                    </div>
                    <div class="total-row">
                        <span>الخصم:</span>
                        <span><input type="number" id="discount" value="0" placeholder="0"> ج.م</span>
                    </div>
                    <div class="total-row final">
                        <span>الإجمالي:</span>
                        <span id="totalAmount">0 ج.م</span>
                    </div>
                </div>

              
                <div class="action-buttons">
               <button class="btn-checkout" onclick="processSale()">
                    <i class="fas fa-check-circle"></i> إتمام البيع
                </button>

                    <button class="btn-whatsapp" onclick="sendWhatsApp()">
                        <i class="fab fa-whatsapp"></i> واتساب
                    </button>
                 
                </div>
            </div>
        </div>
    </div>

    <div class="pending-invoices-list" id="pendingInvoicesList">
        <div style="font-weight: 800; margin-bottom: 10px;">
            <i class="fas fa-clock"></i> فواتير في الانتظار
        </div>
        <div id="pendingInvoicesListContent"></div>
    </div>

    <div class="invoice-modal" id="invoiceModal">
        <div class="invoice-content">
            <div id="invoiceHTML"></div>
            <div style="text-align: center; margin-top: 25px;">
                <button onclick="closeInvoiceModal()" style="padding: 12px 25px; background: #1a1a2e; color: white; border: none; border-radius: 15px;">إغلاق</button>
                <button onclick="printInvoiceModal()" style="padding: 12px 25px; background: #ff6b6b; color: white; border: none; border-radius: 15px;">طباعة</button>
            </div>
        </div>
    </div>



    <script src="module.js"></script>
</body>
</html>
