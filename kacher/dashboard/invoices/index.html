<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>براند فون OS · نظام الفواتير المتقدم</title>
  <link rel="icon" href="https://os-br.pages.dev/icone.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #000000;
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --gold: #d4a843;
      --gold-light: #e8c96e;
      --gold-dark: #b8942f;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
      --radius-sm: 12px;
      --radius-md: 20px;
      --font: 'Cairo', 'Segoe UI', sans-serif;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #8b5cf6;
    }
    body { font-family: var(--font); background: var(--bg-secondary); min-height: 100vh; padding: 20px; }
    
    .header {
      background: var(--bg-primary); padding: 15px 25px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 15px; margin-bottom: 25px; border: 1px solid rgba(212,168,67,0.1);
    }
    .header .logo-section { display: flex; align-items: center; gap: 12px; }
    .header .logo-section img { width: 40px; height: 40px; border-radius: 50%; }
    .header .logo-section h1 { font-size: 20px; font-weight: 900; color: var(--primary); }
    .header .logo-section h1 span { color: var(--gold); }
    .header .page-title { font-size: 14px; color: #999; font-weight: 600; }
    .user-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logout-btn, .back-btn { padding: 6px 16px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
    .logout-btn { background: var(--danger); color: white; }
    .logout-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(239,68,68,0.3); }
    .back-btn { background: var(--bg-secondary); color: var(--primary); border: 2px solid #e5e7eb; }
    .back-btn:hover { border-color: var(--gold); transform: translateY(-2px); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; margin-bottom: 25px;
    }
    .stat-card {
      background: var(--bg-primary); padding: 16px 18px; border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm); border-right: 4px solid var(--gold);
      transition: 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .stat-card .label { font-size: 12px; color: #888; font-weight: 600; }
    .stat-card .value { font-size: 22px; font-weight: 900; color: var(--primary); margin-top: 4px; }
    .stat-card .sub { font-size: 11px; color: #aaa; margin-top: 2px; }
    .stat-card.gold { border-right-color: var(--gold); }
    .stat-card.green { border-right-color: var(--success); }
    .stat-card.red { border-right-color: var(--danger); }
    .stat-card.blue { border-right-color: var(--info); }
    .stat-card.purple { border-right-color: var(--purple); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; align-items: center;
      background: var(--bg-primary); padding: 15px 20px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .toolbar .search-box { flex: 1; min-width: 180px; display: flex; gap: 10px; }
    .toolbar .search-box input { flex: 1; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: var(--radius-sm); font-family: var(--font); font-size: 14px; transition: 0.3s; }
    .toolbar .search-box input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(212,168,67,0.1); }
    .toolbar .filter-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar .filter-group select, .toolbar .filter-group input[type="date"] {
      padding: 9px 12px; border: 2px solid #e5e7eb; border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 13px; background: white; min-width: 100px;
    }
    .toolbar .filter-group select:focus, .toolbar .filter-group input:focus {
      outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(212,168,67,0.1);
    }
    .toolbar .filter-group label { font-size: 13px; color: #666; font-weight: 600; }
    .filter-btn {
      padding: 9px 20px; background: var(--gold); color: white; border: none;
      border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; transition: 0.3s;
    }
    .filter-btn:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(212,168,67,0.3); }

    .invoices-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
      margin-bottom: 25px;
    }
    .invoice-card {
      background: var(--bg-primary); border-radius: var(--radius-md); padding: 18px 20px;
      box-shadow: var(--shadow-sm); border: 1px solid rgba(212,168,67,0.08);
      transition: 0.2s; display: flex; flex-direction: column;
    }
    .invoice-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .invoice-card .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 10px; }
    .invoice-card .card-header .inv-number { font-weight: 900; font-size: 16px; }
    .invoice-card .card-header .inv-date { font-size: 12px; color: #999; }
    .invoice-card .card-body { flex: 1; }
    .invoice-card .card-body .customer { font-weight: 600; font-size: 15px; }
    .invoice-card .card-body .phone { font-size: 13px; color: #666; }
    .invoice-card .card-body .items-summary { font-size: 12px; color: #888; margin-top: 4px; }
    .invoice-card .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f0f0f0; flex-wrap: wrap; gap: 8px; }
    .invoice-card .card-footer .amount { font-size: 20px; font-weight: 900; color: var(--gold-dark); }
    .badge-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-badge, .payment-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
    .status-badge.completed { background: #d1fae5; color: var(--success); }
    .status-badge.debt { background: #fee2e2; color: var(--danger); }
    .payment-badge.cash { background: #d1fae5; color: var(--success); }
    .payment-badge.debt { background: #fee2e2; color: var(--danger); }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .card-actions button { padding: 5px 12px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; }
    .card-actions .view-btn { background: var(--info); color: white; }
    .card-actions .print-btn { background: var(--gold); color: white; }
    .card-actions .whatsapp-btn { background: #25D366; color: white; }

    .empty-state { text-align: center; padding: 40px 20px; color: #999; grid-column: 1 / -1; }
    .empty-state .icon { font-size: 50px; display: block; margin-bottom: 10px; }

    .chart-container {
      background: var(--bg-primary); border-radius: var(--radius-md); padding: 20px;
      box-shadow: var(--shadow-sm); margin-bottom: 25px;
    }
    .chart-container canvas { max-height: 250px; width: 100% !important; }

    .modal-overlay { position: fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--bg-primary);padding:30px;border-radius:var(--radius-md);max-width:650px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp 0.3s ease; }
    @keyframes slideUp { 0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)} }
    .modal .modal-header { display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f0f0f0;padding-bottom:15px;margin-bottom:20px; }
    .modal .modal-header h3 { font-size:20px; }
    .modal .modal-header .close-modal { background:none;border:none;font-size:28px;cursor:pointer;color:#999;transition:0.3s; }
    .modal .modal-header .close-modal:hover { color:var(--danger);transform:rotate(90deg); }
    .modal .detail-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5; }
    .modal .detail-row .label { color:#999;font-weight:500; }
    .modal .invoice-items { background:var(--bg-secondary);border-radius:var(--radius-sm);padding:12px;margin:15px 0; }
    .modal .item-row { display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #e5e7eb;font-size:13px; }
    .modal .item-row.header { font-weight:700;color:#666;border-bottom:2px solid #ddd; }
    .modal .item-row .item-total { font-weight:700;color:var(--gold-dark); }
    .modal .modal-actions { display:flex;gap:10px;margin-top:20px;padding-top:15px;border-top:2px solid #f0f0f0;flex-wrap:wrap; }
    .modal .modal-actions button { flex:1;padding:10px;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;transition:0.3s;min-width:80px; }
    .modal .modal-actions .close-modal-btn { background:var(--bg-secondary); }
    .modal .modal-actions .print-modal-btn { background:var(--gold);color:white; }
    .modal .modal-actions .whatsapp-modal-btn { background:#25D366;color:white; }

    .pagination { display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap; }
    .pagination button { padding:8px 18px;border:2px solid #e5e7eb;border-radius:var(--radius-sm);background:white;font-weight:600;cursor:pointer;transition:0.3s; }
    .pagination button:hover:not(:disabled) { border-color:var(--gold);background:rgba(212,168,67,0.05); }
    .pagination button:disabled { opacity:0.4;cursor:not-allowed; }
    .pagination .page-info { padding:8px 14px;font-weight:600;color:#666; }

    .toast { position:fixed;bottom:30px;right:30px;background:var(--bg-primary);padding:14px 24px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);border-right:4px solid var(--success);display:none;align-items:center;gap:12px;z-index:1000;min-width:250px; }
    .toast.show { display:flex; }
    .toast.error { border-right-color:var(--danger); }

    @media (max-width:768px) { 
      .stats-grid { grid-template-columns:1fr 1fr; } 
      .invoices-grid { grid-template-columns:1fr; }
      .toolbar .filter-group select,
      .toolbar .filter-group input { min-width:80px; }
      .modal .item-row { grid-template-columns:1fr 1fr; }
      .modal .item-row.header { display:none; }
    }
    @media (max-width:500px) { 
      .stats-grid { grid-template-columns:1fr 1fr; }
      .header .logo-section h1 { font-size:16px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center;gap:20px;">
    <div class="logo-section"><img src="https://os-br.pages.dev/icone.png" alt="brand"><h1>براند فون <span>OS</span></h1></div>
    <span class="page-title">🧾 نظام الفواتير المتقدم</span>
  </div>
  <div class="user-section">
    <a href="/kacher/dashboard/" class="back-btn">📊 الرئيسية</a>
    <span style="font-size:13px;color:#666;" id="userEmail">مرحباً</span>
    <button class="logout-btn" id="logoutBtn">🚪 خروج</button>
  </div>
</header>

<div class="stats-grid" id="statsGrid">
  <div class="stat-card gold"><span class="label">📅 فواتير اليوم</span><span class="value" id="todayCount">0</span><span class="sub">فاتورة</span></div>
  <div class="stat-card gold"><span class="label">💰 مبيعات اليوم</span><span class="value" id="todayTotal">0 ₪</span></div>
  <div class="stat-card green"><span class="label">📈 أرباح اليوم</span><span class="value" id="todayProfit">0 ₪</span></div>
  <div class="stat-card blue"><span class="label">📊 فواتير الشهر</span><span class="value" id="monthCount">0</span><span class="sub">فاتورة</span></div>
  <div class="stat-card blue"><span class="label">💰 مبيعات الشهر</span><span class="value" id="monthTotal">0 ₪</span></div>
  <div class="stat-card green"><span class="label">📈 أرباح الشهر</span><span class="value" id="monthProfit">0 ₪</span></div>
  <div class="stat-card red"><span class="label">📝 إجمالي الأجل</span><span class="value" id="totalDebt">0 ₪</span><span class="sub">مستحق عليهم</span></div>
  <div class="stat-card purple"><span class="label">💵 إجمالي الكاش</span><span class="value" id="totalCash">0 ₪</span><span class="sub">مدفوع نقداً</span></div>
</div>

<div class="chart-container">
  <canvas id="profitChart"></canvas>
</div>

<div class="toolbar">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 بحث برقم الفاتورة أو العميل..." />
  </div>
  <div class="filter-group">
    <select id="paymentFilter">
      <option value="all">💳 جميع الطرق</option>
      <option value="cash">💰 كاش</option>
      <option value="debt">📝 أجل</option>
    </select>
    <select id="statusFilter">
      <option value="all">📌 جميع الحالات</option>
      <option value="completed">✅ مكتملة</option>
      <option value="debt">📝 أجل</option>
    </select>
    <label>📅 من</label>
    <input type="date" id="dateFrom" />
    <label>إلى</label>
    <input type="date" id="dateTo" />
    <button class="filter-btn" id="applyFilterBtn">تطبيق</button>
  </div>
</div>

<div class="invoices-grid" id="invoicesGrid">
  <div class="empty-state"><span class="icon">🧾</span>جاري التحميل...</div>
</div>

<div class="pagination" id="pagination">
  <button id="prevPage">السابق</button>
  <span class="page-info" id="pageInfo">صفحة 1</span>
  <button id="nextPage">التالي</button>
</div>

<div class="modal-overlay" id="invoiceModal"><div class="modal">
  <div class="modal-header"><h3 id="modalInvoiceNumber">🧾 فاتورة</h3><button class="close-modal" id="closeModalBtn">✕</button></div>
  <div id="modalContent">
    <div id="modalDetail"></div>
    <div class="invoice-items" id="modalItems"></div>
    <div id="modalTotal" style="display:flex;justify-content:space-between;padding:12px;background:rgba(212,168,67,0.08);border-radius:var(--radius-sm);">
      <span>💰 الإجمالي:</span>
      <span id="modalTotalValue" style="font-size:20px;font-weight:900;color:var(--gold-dark);">0 ₪</span>
    </div>
  </div>
  <div class="modal-actions">
    <button class="close-modal-btn" onclick="closeInvoiceModal()">إغلاق</button>
    <button class="whatsapp-modal-btn" id="whatsappModalBtn">📱 واتساب</button>
    <button class="print-modal-btn" id="printModalBtn">🖨️ طباعة</button>
  </div>
</div></div>

<div class="toast" id="toast"><span class="toast-icon">✅</span><span class="toast-message" id="toastMessage">تم</span></div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
  }
}
</script>

<script type="module" src="script.js">

</script>
</body>
</html>
