<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث عن المنتجات - OS Store</title>
    
    <!-- SEO -->
    <meta name="description" content="ابحث عن المنتجات في متجر OS">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/icone.png">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts - Zain -->
    <link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/CSS/header.css">

</head>
<body>


<header>
  <div class="a-header">

    <!-- زر الموبايل -->
     <button class="menu-btn" id="menuBtn" aria-label="menu">
       <svg class="icon" width="18" height="18" viewBox="0 0 18 18">
         <!-- خط فوق -->
         <line class="line line1" x1="2" y1="6" x2="16" y2="6"/>
         <!-- خط تحت -->
         <line class="line line2" x1="2" y1="12" x2="16" y2="12"/>
       </svg>
     </button>


    <a href="/bag/" class="cart"> 
        <img width="22" height="22" src="https://img.icons8.com/deco/48/shopping-bag.png" alt="سلة التسوق">
        <span class="cart-count" id="cartCount">0</span>
    </a>

    <a href="/search/" class="cart"> 
      <img width="20" height="20" src="https://img.icons8.com/ios-glyphs/30/search--v1.png">
    </a>

    <!-- منيو الديسكتوب -->
    <div class="a-nav">
      <a href="/phone/">هواتف</a>
      <a href="/accessories/">اكسسوارات</a>
      <a href="/haed-phons/">هيدفونز</a>
      <a href="/airpods/">ايربودز</a>
    </div>
  </div>

  <!-- منيو الموبايل -->
  <div class="mnu-mobile" id="mnu-mobile">
    <a href="/phone/">هواتف</a>
    <a href="/accessories/">اكسسوارات</a>
    <a href="/haed-phons/">هيدفونز</a>
    <a href="/airpods/">ايربودز</a>
  </div>

  <img src="https://os-br.pages.dev/icone.png" class="logo">
</header>


<div class="cont">
    <div class="market">
        <h1>متجرنا.</h1>
    </div>
    <div class="Des">
        <h2>الطريقة الأفضل لتشتري المنتجات التي تحب.</h2>
        <a href="" class="call">تواصل مع أحد المختصين</a>
    </div>
</div>


<div class="search-box">
    <input type="text" id="search" placeholder="ابحث باسم المنتج، الوصف، أو الرقم التسلسلي..." autofocus>
</div>

<div class="products" id="products">
    <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <h3>جاري تحميل المنتجات...</h3>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
(function() {
    // تهيئة Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAvLmzn4rnQrPrIeP40wzgbXqDy5xMhO7o",
        authDomain: "stor-121.firebaseapp.com",
        projectId: "stor-121",
        storageBucket: "stor-121.firebasestorage.app",
        messagingSenderId: "944316047610",
        appId: "1:944316047610:web:8ceeab3664e0e25d0da943",
        measurementId: "G-F4JBRJKR1R"
    };

    // تهيئة Firebase
    let db = null;
    let allProducts = [];
    let productsLoaded = false;

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        console.log("✅ Firebase initialized");
    } catch (err) {
        console.log("⚠️ Firebase error:", err);
    }

    // عناصر DOM
    const productsContainer = document.getElementById("products");
    const searchInput = document.getElementById("search");

    // دالة عرض المنتجات
    function displayProducts(products) {
        if (!productsContainer) return;

        if (products.length === 0) {
            productsContainer.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-search"></i>
                    <h3>لا يوجد منتجات</h3>
                    <p>لم نتمكن من العثور على منتجات متاحة</p>
                </div>
            `;
            return;
        }

        let html = '';
        products.forEach(p => {
            // تحديد نص الفئة
            let categoryText = 'منتج';
            if (p.type === 'accessories') categoryText = 'اكسسوار';
            if (p.type === 'Airpods') categoryText = 'ايربودز';
            if (p.type === 'head phone') categoryText = 'هيدفونز';
            else if (p.type === 'phone') categoryText = 'موبايل';

            
            html += `
                <div class="card">
                    <div class="card-image">
                        <img src="${p.image || 'https://via.placeholder.com/400x400/e0e0e0/607d8b?text=OS'}" 
                             alt="${p.title}"
                             loading="lazy"
                             onerror="this.src='https://via.placeholder.com/400x400/e0e0e0/607d8b?text=OS'">
                        
                        <div class="category-badge">
                            ${categoryText}
                        </div>
                    </div>
                    
                    <div class="card-content">
                        <div class="product-title">${p.title || 'منتج'}</div>
                        
                        ${p.serial ? `
                            <div class="product-serial">
                                <i class="fas fa-barcode"></i>
                                <span>${p.serial}</span>
                            </div>
                        ` : ''}
                        
                        <div class="product-price">
                            <span class="price-label">السعر:</span>
                            <span class="price-value">${p.sellPrice.toLocaleString('ar-EG')}</span>
                            <span class="price-currency">ج.م</span>
                        </div>
                    </div>
                    
                    <!-- زر عرض التفاصيل -->
                    <a href="/product/index.html?id=${p.id}" class="details-btn">
                        <i class="fas fa-eye"></i>
                        عرض التفاصيل
                    </a>
                </div>
            `;
        });

        productsContainer.innerHTML = html;
    }

    // دالة تحميل المنتجات
    async function loadProducts() {
        if (!db) {
            productsContainer.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>خطأ في الاتصال</h3>
                    <p>تعذر الاتصال بقاعدة البيانات</p>
                </div>
            `;
            return;
        }

        try {
            const querySnapshot = await db.collection("products").get();
            
            allProducts = [];
            querySnapshot.forEach(doc => {
                const data = doc.data();
                
                // ✅ فقط أضف المنتج إذا كانت الكمية أكبر من 0
                const quantity = data.quantity || 0;
                if (quantity > 0) {
                    allProducts.push({
                        id: doc.id,
                        title: data.title || "منتج بدون اسم",
                        description: data.description || "",
                        serial: data.serial || "",
                        sellPrice: data.sellPrice || 0,
                        type: data.type || "product",
                        image: data.images && data.images.length > 0 ? data.images[0] : null,
                        quantity: quantity
                    });
                }
            });

            console.log(`✅ تم تحميل ${allProducts.length} منتج متاح`);

            productsLoaded = true;
            displayProducts(allProducts);

        } catch (error) {
            console.error("Error loading products:", error);
            productsContainer.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>حدث خطأ</h3>
                    <p>${error.message || 'تعذر تحميل المنتجات'}</p>
                    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 30px; background: #000; color: white; border: none; border-radius: 30px; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> إعادة المحاولة
                    </button>
                </div>
            `;
        }
    }

    // فلترة المنتجات
    function filterProducts(searchTerm) {
        if (!searchTerm.trim()) {
            return allProducts;
        }

        const term = searchTerm.toLowerCase().trim();
        return allProducts.filter(p => 
            (p.title && p.title.toLowerCase().includes(term)) ||
            (p.description && p.description.toLowerCase().includes(term)) ||
            (p.serial && p.serial.toLowerCase().includes(term))
        );
    }

    // حدث البحث
    searchInput.addEventListener("input", function() {
        if (!productsLoaded) return;
        
        const filtered = filterProducts(this.value);
        displayProducts(filtered);
    });

    // تفريغ البحث عند الضغط على ESC
    searchInput.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            this.value = "";
            displayProducts(allProducts);
        }
    });

    // بدأ التحميل
    loadProducts();

})();
</script>

</body>
</html>
