<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منتج + سلة</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f6f6f6;
    margin: 0;
    padding: 0;
}

/* ====== الهيدر ====== */
header {
    background: #111;
    color: #fff;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart {
    position: relative;
    font-size: 22px;
    cursor: pointer;
}

.cart span {
    position: absolute;
    top: -8px;
    right: -10px;
    background: red;
    color: #fff;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 50%;
}

/* ====== المنتج ====== */
.container {
    max-width: 900px;
    margin: 40px auto;
}

.product {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    gap: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.product img {
    width: 250px;
    border-radius: 15px;
}

.product-info h2 {
    margin: 0;
}

.price {
    font-size: 22px;
    color: #27ae60;
    margin: 10px 0;
}

.add-btn {
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.add-btn:hover {
    background: #333;
}

/* ====== أنميشن ====== */
.added {
    animation: pop 0.4s ease;
}

@keyframes pop {
    0% {transform: scale(1);}
    50% {transform: scale(1.2);}
    100% {transform: scale(1);}
}

/* ====== السلة ====== */
.cart-box {
    background: #fff;
    margin-top: 30px;
    padding: 20px;
    border-radius: 15px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
    padding: 10px 0;
}
</style>
</head>

<body>

<header>
    <h3>متجري</h3>
    <div class="cart">🛒 <span id="cartCount">0</span></div>
</header>

<div class="container">

    <!-- المنتج -->
    <div class="product">
        <img src="https://via.placeholder.com/300" alt="">
        <div class="product-info">
            <h2 id="productName">تصميم كارت شخصي</h2>
            <div class="price" id="productPrice">150 جنيه</div>
            <button class="add-btn" onclick="addToCart()">إضافة للسلة</button>
        </div>
    </div>

    <!-- السلة -->
    <div class="cart-box">
        <h3>السلة</h3>
        <div id="cartItems"></div>
    </div>

</div>

<script>
let cartCount = 0;

function addToCart() {
    cartCount++;
    const cartCounter = document.getElementById("cartCount");
    cartCounter.innerText = cartCount;

    // أنميشن
    cartCounter.classList.add("added");
    setTimeout(() => cartCounter.classList.remove("added"), 400);

    // إضافة المنتج للسلة
    const name = document.getElementById("productName").innerText;
    const price = document.getElementById("productPrice").innerText;

    const item = document.createElement("div");
    item.className = "cart-item";
    item.innerHTML = `<span>${name}</span><span>${price}</span>`;

    document.getElementById("cartItems").appendChild(item);
}
</script>

</body>
</html>
