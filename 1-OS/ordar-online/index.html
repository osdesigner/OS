<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - الطلبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ====== المتغيرات والأساس ====== */
    :root {
      --primary: #2e7d32; /* أخضر داكن */
      --primary-light: #4caf50; /* أخضر فاتح */
      --secondary: #607d8b; /* رمادي أزرق */
      --secondary-light: #90a4ae; /* رمادي فاتح */
      --background: #f9fafb;
      --card-bg: #ffffff;
      --text-primary: #263238;
      --text-secondary: #546e7a;
      --border: #e0e0e0;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.12);
      --success: #4caf50;
      --warning: #ff9800;
      --info: #2196f3;
      --whatsapp: #25D366;
      --phone: #34B7F1;
      --email: #EA4335;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      direction: rtl;
      padding: 20px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ====== الهيدر الرئيسي ====== */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }

    .dashboard-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dashboard-header h1 i {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      gap: 15px;
    }

    .filter-btn {
      padding: 10px 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .filter-btn:hover {
      background: var(--secondary-light);
      color: white;
    }

    .refresh-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--secondary);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      background: var(--primary);
      transform: rotate(90deg);
    }

    /* ====== شريط البحث المتقدم ====== */
    .search-container {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .search-group {
      flex: 1;
      min-width: 250px;
    }

    .search-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--secondary);
      font-size: 14px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    .search-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      align-self: flex-end;
    }

    .search-btn:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    .clear-btn {
      padding: 12px 24px;
      background: var(--secondary-light);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      align-self: flex-end;
    }

    .clear-btn:hover {
      background: var(--secondary);
      transform: translateY(-2px);
    }

    /* ====== إحصائيات سريعة ====== */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: var(--shadow);
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .stat-icon.review {
      background: rgba(117, 117, 117, 0.1);
      color: var(--secondary);
    }

    .stat-icon.preparing {
      background: rgba(255, 152, 0, 0.1);
      color: var(--warning);
    }

    .stat-icon.delivered {
      background: rgba(76, 175, 80, 0.1);
      color: var(--success);
    }

    .stat-info h3 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-info p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ====== كارت الطلب المحسّن ====== */
    .orders-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 25px;
    }

    @media (max-width: 900px) {
      .orders-container {
        grid-template-columns: 1fr;
      }
    }

    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .order-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-6px);
    }

    .order-header {
      background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-id {
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

   

    /* ====== أزرار التواصل السريعة ====== */
    .contact-buttons {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      background: #f8f9fa;
      border-bottom: 1px solid var(--border);
    }

    .contact-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
      font-size: 14px;
      color: white;
    }

    .contact-btn.phone {
      background: var(--phone);
    }

    .contact-btn.whatsapp {
      background: var(--whatsapp);
    }

    .contact-btn.email {
      background: var(--email);
    }

    .contact-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* ====== معلومات العميل ====== */
    .customer-info {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(96, 125, 139, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary);
    }

    .info-text {
      flex: 1;
    }

    .info-text p {
      margin: 2px 0;
      font-size: 14px;
    }

    .info-label {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .info-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ====== المنتجات ====== */
    .items-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      flex-grow: 1;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item {
      display: flex;
      gap: 15px;
      padding: 15px;
      margin-bottom: 12px;
      background: #f9f9f9;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .item:hover {
      background: #f0f0f0;
    }

    .item:last-child {
      margin-bottom: 0;
    }

    .item-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .item-details {
      flex: 1;
    }

    .item-title {
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-primary);
    }

    .item-price {
      color: var(--primary);
      font-weight: 700;
      font-size: 15px;
    }

    .item-qty {
      background: var(--secondary-light);
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
      margin-right: 8px;
    }

    /* ====== الحالة والأزرار ====== */
    .order-footer {
      padding: 20px;
      background: #f8f9fa;
      border-top: 1px solid var(--border);
    }

    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .status-select-container {
      flex: 1;
      margin-right: 15px;
    }

    .status-select {
      width: 70%;
      padding: 10px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .status-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    .status-select option {
      padding: 10px;
    }

    .status-select.review {
      color: var(--secondary);
      border-left: 4px solid var(--secondary);
    }

    .status-select.preparing {
      color: black;
      border-left: 4px solid var(--warning);
    }

    .status-select.delivered {
      color: var(--success);
      border-left: 4px solid var(--success);
    }

    .total-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      white-space: nowrap;
    }

    .update-status-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s;
      font-size: 15px;
      margin-top: 10px;
    }

    .update-status-btn:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    /* ====== حالة عدم وجود طلبات ====== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty-icon {
      font-size: 60px;
      color: var(--secondary-light);
      margin-bottom: 20px;
    }

    .empty-state h3 {
      font-size: 22px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .empty-state p {
      color: var(--text-secondary);
      max-width: 400px;
      margin: 0 auto;
    }

    /* ====== موبايل ====== */
    @media (max-width: 768px) {
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      
      .header-controls {
        width: 100%;
        justify-content: space-between;
      }
      
      .stats-container {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .search-container {
        flex-direction: column;
      }
      
      .search-group {
        min-width: 100%;
      }
      
      .status-container {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }
      
      .status-select-container {
        margin-right: 0;
      }
      
      .total-price {
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .stats-container {
        grid-template-columns: 1fr;
      }
      
      .contact-buttons {
        flex-direction: column;
      }
      
      .item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      
      .item-img {
        width: 100%;
        height: 150px;
      }
    }

    /* ====== فلتر الحالة ====== */
    .status-filter {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .status-filter-btn {
      padding: 10px 20px;
      border: 2px solid var(--border);
      background: white;
      border-radius: 30px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .status-filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .status-filter-btn:hover:not(.active) {
      background: var(--secondary-light);
      color: white;
      border-color: var(--secondary-light);
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <h1><i class="fas fa-box-open"></i> إدارة الطلبات</h1>
    <div class="header-controls">
      <button class="filter-btn" id="filterBtn">
        <i class="fas fa-filter"></i>
        فلترة الطلبات
      </button>
      <button class="refresh-btn" id="refreshBtn">
        <i class="fas fa-redo"></i>
      </button>

    <div class="search-group">

    <div class="search-group">

      <input type="text" id="searchPhone" class="search-input" placeholder="رقم الهاتف...">
    </div>
    
    <button class="search-btn" id="searchBtn">
      <i class="fas fa-search"></i>
      بحث
    </button>
    
    <button class="clear-btn" id="clearBtn">
      <i class="fas fa-times"></i>
      مسح البحث
    </button>
  </div>

  <!-- فلتر الحالة -->
  <div class="status-filter" id="statusFilter">
    <button class="status-filter-btn active" data-status="all">الكل</button>
    <button class="status-filter-btn" data-status="قيد المراجعة">قيد المراجعة</button>
    <button class="status-filter-btn" data-status="جاري التحضير">جاري التحضير</button>
    <button class="status-filter-btn" data-status="تم التوصيل">تم التوصيل</button>
    <button class="status-filter-btn" data-status="ملغى">ملغى</button>
  </div>

  <!-- إحصائيات سريعة -->

        <p>قيد المراجعة</p>
      </div>

    <div class="stat-card">

    <div class="stat-card">
      <div class="stat-icon delivered">

      <div class="stat-info">
        <h3 id="deliveredCount">0</h3>
        <p>تم التوصيل</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-shopping-cart" style="background: rgba(33, 150, 243, 0.1); color: #2196f3;"></i>

      <div class="stat-info">
        <h3 id="totalOrders">0</h3>
        <p>إجمالي الطلبات</p>
      </div>
    </div>
  </div>

      orders.forEach(order => {

        else if (status === "ملغى") cancelledCount++;
      });
      
      reviewCountEl.textContent = reviewCount;

      deliveredCountEl.textContent = deliveredCount;
      totalOrdersEl.textContent = orders.length;

      const date = timestamp.toDate ? timestamp.toDate() : new Date();

        year: "numeric",

      });

  } else {

    `https://os-br.pages.dev/1-admin-OS/ordar-stor-online/review/?id=${order.orderId}`;

  return `
مرحباً ${customerName}

تفاصيل طلبك:

- المنتجات:
${itemsTable}

- إجمالي الطلب: ${order.total || 0} ج.م
- رقم الطلب: ${order.orderId || "-"}

- حالة الطلب: جاري تجهيز طلبك

📦 تابع حالة طلبك من هنا:
${orderLink}

— فريق براند فون
`.trim();
}



    // إنشاء رسالة جيميل
    function createEmailMessage(order) {
      const customerName = order.customerName || `${order.firstName || ""} ${order.lastName || ""}`.trim();
      const itemsList = order.orders?.[0]?.items?.map(item => 
        `<tr><td>${item.title}</td><td>${item.qty}</td><td>${item.price} ج.م</td><td>${item.price * item.qty} ج.م</td></tr>`
      ).join("") || "<tr><td colspan='4'>لا توجد منتجات</td></tr>";
      
      return `Subject: تفاصيل طلبك - ${order.orderId || ""}

عزيزي/عزيزتي ${customerName},

تفاصيل طلبك:
<table border="1" cellpadding="8">
  <tr>
    <th>المنتج</th>
    <th>الكمية</th>
    <th>السعر</th>
    <th>الإجمالي</th>
  </tr>
  ${itemsList}
</table>

الإجمالي: ${order.total || 0} ج.م
رقم الطلب: ${order.orderId || ""}

شكراً لثقتكم بنا!
فريق الدعم`;
    }

    // فلترة الطلبات
    function filterOrders() {
      let filtered = [...allOrders];
      
      // فلترة حسب الحالة
      if (currentFilterStatus !== "all") {
        filtered = filtered.filter(order => 
          (order.status || "قيد المراجعة") === currentFilterStatus
        );
      }
      
      // فلترة حسب البحث
      if (currentSearchQuery) {
        const query = currentSearchQuery.toLowerCase();
        filtered = filtered.filter(order => {
          const name = order.customerName || `${order.firstName || ""} ${order.lastName || ""}`.trim().toLowerCase();
          const orderId = (order.orderId || "").toLowerCase();
          const phone = (order.phone || "").toLowerCase();
          
          return name.includes(query) || 
                 orderId.includes(query) || 
                 phone.includes(query);
        });
      }
      
      return filtered;
    }

    // عرض الطلبات
    function displayOrders(orders) {
      ordersContainer.innerHTML = "";
      
      if (orders.length === 0) {
        ordersContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-box-open"></i>
            </div>
            <h3>${currentSearchQuery || currentFilterStatus !== "all" ? "لا توجد طلبات مطابقة" : "لا توجد طلبات حالياً"}</h3>
            <p>${currentSearchQuery || currentFilterStatus !== "all" ? "جرب مصطلحات بحث أخرى أو أعد تعيين الفلتر" : "لم يتم تقديم أي طلبات حتى الآن. ستظهر هنا عند استلام طلبات جديدة."}</p>
          </div>
        `;
        updateStats(orders);
        return;
      }
      
      orders.forEach(order => {
        const orderDiv = document.createElement("div");
        orderDiv.className = "order-card";
        
        // تحديد لون وشكل الحالة
        const status = order.status || "قيد المراجعة";
        let statusClass = "review";
        let statusIcon = "fas fa-clock";
        
        if (status === "جاري التحضير") {
          statusClass = "preparing";
          statusIcon = "fas fa-utensils";
        } else if (status === "تم التوصيل") {
          statusClass = "delivered";
          statusIcon = "fas fa-check-circle";
        } else if (status === "ملغى") {
          statusClass = "review";
          statusIcon = "fas fa-times-circle";
        }

        
        
        // إنشاء رابط الاتصال
       const phoneNumber = order.phone || "";

// نشيل أي رموز
let cleanPhone = phoneNumber.replace(/\D/g, '');

// لو بيبدأ بـ 0 نشيله
if (cleanPhone.startsWith("0")) {
  cleanPhone = cleanPhone.substring(1);
}

// لو مش مضاف كود مصر، نضيفه
if (cleanPhone && !cleanPhone.startsWith("20")) {
  cleanPhone = "20" + cleanPhone;
}

        const whatsappLink = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(createWhatsAppMessage(order))}` : "#";
        const telLink = phoneNumber ? `tel:${phoneNumber}` : "#";
        const emailLink = order.email ? `mailto:${order.email}?subject=تفاصيل طلبك - ${order.orderId || ""}&body=${encodeURIComponent(createEmailMessage(order))}` : "#";
        
        orderDiv.innerHTML = `
          <div class="order-header">
            <div class="order-id">
              <i class="fas fa-hashtag"></i>
              ${order.orderId || order.id.substring(0, 8)}
            </div>
            
          </div>
          
          <div class="contact-buttons">
            <a href="${telLink}" class="contact-btn phone" ${!phoneNumber ? 'style="opacity:0.5; cursor:not-allowed;"' : ''}>
              <i class="fas fa-phone-alt"></i>
              إتصل
            </a>
            <a href="${whatsappLink}" target="_blank" class="contact-btn whatsapp" ${!cleanPhone ? 'style="opacity:0.5; cursor:not-allowed;"' : ''}>
              <i class="fab fa-whatsapp"></i>
              واتساب
            </a>
            <a href="${emailLink}" class="contact-btn email" ${!order.email ? 'style="opacity:0.5; cursor:not-allowed;"' : ''}>
              <i class="fas fa-envelope"></i>
              بريد
            </a>
          </div>
          
          <div class="customer-info">
            <div class="info-row">
              <div class="info-icon">
                <i class="fas fa-user"></i>
              </div>
              <div class="info-text">
                <p class="info-label">العميل</p>
                <p class="info-value">${order.customerName || `${order.firstName || ""} ${order.lastName || ""}`.trim() || "غير محدد"}</p>
              </div>
            </div>
            
            <div class="info-row">
              <div class="info-icon">
                <i class="fas fa-phone"></i>
              </div>
              <div class="info-text">
                <p class="info-label">الهاتف</p>
                <p class="info-value">${order.phone || "-"}</p>
              </div>
            </div>
            
            <div class="info-row">
              <div class="info-icon">
                <i class="fas fa-envelope"></i>
              </div>
              <div class="info-text">
                <p class="info-label">البريد الإلكتروني</p>
                <p class="info-value">${order.email || "-"}</p>
              </div>
            </div>
            
            <div class="info-row">
              <div class="info-icon">
                <i class="fas fa-map-marker-alt"></i>
              </div>
              <div class="info-text">
                <p class="info-label">العنوان</p>
                <p class="info-value">${order.address || "-"}</p>
              </div>
            </div>
          </div>
          
          <div class="items-section">
            <div class="section-title">
              <i class="fas fa-shopping-basket"></i>
              المنتجات (${order.orders?.[0]?.items?.length || 0})
            </div>
            <div class="items-list" id="items-${order.id}">
              <!-- سيتم تعبئة المنتجات هنا -->
            </div>
          </div>
          
          <div class="order-footer">
            <div class="status-container">
              <div class="status-select-container">
                <select class="status-select ${statusClass}" id="status-select-${order.id}">
                  <option value="قيد المراجعة" ${status === "قيد المراجعة" ? "selected" : ""}>قيد المراجعة</option>
                  <option value="جاري التحضير" ${status === "جاري التحضير" ? "selected" : ""}>جاري التحضير</option>
                  <option value="تم التوصيل" ${status === "تم التوصيل" ? "selected" : ""}>تم التوصيل</option>
                  <option value="ملغى" ${status === "ملغى" ? "selected" : ""}>ملغى</option>
                </select>
              </div>
              <div class="total-price">
                ${order.total || 0} ج.م
              </div>
            </div>
            
            <button class="update-status-btn" data-order-id="${order.id}">
              <i class="fas fa-sync-alt"></i>
              تحديث الحالة
            </button>
          </div>
        `;
        
        // تعبئة المنتجات
        const itemsContainer = orderDiv.querySelector(`#items-${order.id}`);
        const items = order.orders?.[0]?.items || [];
        
        if (items.length === 0) {
          itemsContainer.innerHTML = '<p style="text-align: center; color: #999; padding: 10px;">لا توجد منتجات</p>';
        } else {
          items.forEach(item => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "item";
            
            itemDiv.innerHTML = `
              <img src="${item.image || 'https://via.placeholder.com/100x100/e0e0e0/607d8b?text=No+Image'}" alt="${item.title}" class="item-img">
              <div class="item-details">
                <div class="item-title">${item.title || "منتج غير معروف"}</div>
                <div>
                  <span class="item-qty">${item.qty || 1}x</span>
                  <span class="item-price">${item.price || 0} ج.م</span>
                  <span style="font-weight: 700; color: var(--primary); margin-right: 10px;">${(item.price || 0) * (item.qty || 1)} ج.م</span>
                </div>
                ${item.serial ? `<p style="font-size: 12px; color: #666; margin-top: 5px;">رقم تسلسلي: ${item.serial}</p>` : ""}
              </div>
            `;
            
            itemsContainer.appendChild(itemDiv);
          });
        }
        
        ordersContainer.appendChild(orderDiv);
      });
      
      // إضافة أحداث تحديث الحالة
      document.querySelectorAll(".update-status-btn").forEach(btn => {
        btn.addEventListener("click", async function() {
          const orderId = this.getAttribute("data-order-id");
          const selectEl = document.getElementById(`status-select-${orderId}`);
          const newStatus = selectEl.value;
          const orderRef = doc(db, "orders", orderId);
          
          try {
            await updateDoc(orderRef, { status: newStatus });
            
            // تحديث واجهة المستخدم
            const statusSelect = document.getElementById(`status-select-${orderId}`);
            statusSelect.className = `status-select ${newStatus === "جاري التحضير" ? "preparing" : newStatus === "تم التوصيل" ? "delivered" : "review"}`;
            
            // تحديث البيانات المحلية
            const orderIndex = allOrders.findIndex(o => o.id === orderId);
            if (orderIndex !== -1) {
              allOrders[orderIndex].status = newStatus;
              displayOrders(filterOrders());
            }
            
            // إشعار ناجح
            showNotification(`تم تحديث حالة الطلب #${orderId.substring(0, 6)} إلى "${newStatus}"`);
          } catch (error) {
            console.error("Error updating status:", error);
            showNotification("حدث خطأ أثناء تحديث الحالة", "error");
          }
        });
      });
      
      updateStats(orders);
    }

    // تحميل الطلبات من Firebase
    async function loadOrders() {
      ordersContainer.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-spinner fa-spin"></i></div><h3>جاري تحميل الطلبات...</h3></div>';
      
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        allOrders = [];
        
        querySnapshot.forEach(orderSnap => {
          const data = orderSnap.data();
          allOrders.push({id: orderSnap.id, ...data});
        });
        
        // ترتيب الطلبات من الأحدث إلى الأقدم
        allOrders.sort((a, b) => {
          const dateA = a.timestamp?.toDate ? a.timestamp.toDate() : new Date(0);
          const dateB = b.timestamp?.toDate ? b.timestamp.toDate() : new Date(0);
          return dateB - dateA;
        });
        
        displayOrders(filterOrders());
      } catch (error) {
        console.error("Error loading orders:", error);
        ordersContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3>حدث خطأ أثناء التحميل</h3>
            <p>تعذر تحميل الطلبات. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.</p>
          </div>
        `;
      }
    }

    // إظهار الإشعارات
    function showNotification(message, type = "success") {
      // إزالة أي إشعارات سابقة
      const existingNotification = document.querySelector('.notification');
      if (existingNotification) {
        existingNotification.remove();
      }
      
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
        <span>${message}</span>
      `;
      
      // إضافة الأنماط
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        background: ${type === 'success' ? 'var(--primary)' : '#f44336'};
        color: white;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 1000;
        font-weight: 600;
        animation: slideIn 0.3s ease;
      `;
      
      document.body.appendChild(notification);
      
      // إخفاء الإشعار بعد 3 ثوان
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
      
      // إضافة أنيميشن
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideIn {
          from { transform: translateY(-100px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
          from { transform: translateY(0); opacity: 1; }
          to { transform: translateY(-100px); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    // إعداد فلتر الحالة
    function setupStatusFilter() {
      statusFilter.querySelectorAll(".status-filter-btn").forEach(btn => {
        btn.addEventListener("click", function() {
          // إزالة النشط من جميع الأزرار
          statusFilter.querySelectorAll(".status-filter-btn").forEach(b => {
            b.classList.remove("active");
          });
          
          // إضافة النشط للزر المضغوط
          this.classList.add("active");
          
          // تحديث الفلتر
          currentFilterStatus = this.getAttribute("data-status");
          displayOrders(filterOrders());
        });
      });
    }

    // البحث عن الطلبات
    function performSearch() {
      const nameQuery = searchName.value.trim().toLowerCase();
      const orderIdQuery = searchOrderId.value.trim().toLowerCase();
      const phoneQuery = searchPhone.value.trim().toLowerCase();
      
      // دمج جميع مصطلحات البحث
      currentSearchQuery = nameQuery || orderIdQuery || phoneQuery || "";
      
      displayOrders(filterOrders());
    }

    // مسح البحث
    function clearSearch() {
      searchName.value = "";
      searchOrderId.value = "";
      searchPhone.value = "";
      currentSearchQuery = "";
      
      // إعادة تعيين فلتر الحالة إلى الكل
      statusFilter.querySelectorAll(".status-filter-btn").forEach(b => {
        b.classList.remove("active");
        if (b.getAttribute("data-status") === "all") {
          b.classList.add("active");
        }
      });
      
      currentFilterStatus = "all";
      displayOrders(filterOrders());
    }

    // إعداد الأحداث
    function setupEventListeners() {
      refreshBtn.addEventListener("click", loadOrders);
      searchBtn.addEventListener("click", performSearch);
      clearBtn.addEventListener("click", clearSearch);
      
      // البحث عند الضغط على Enter
      [searchName, searchOrderId, searchPhone].forEach(input => {
        input.addEventListener("keypress", function(e) {
          if (e.key === "Enter") {
            performSearch();
          }
        });
      });
      
      setupStatusFilter();
    }

    // التحميل الأولي وإعداد الأحداث
    document.addEventListener("DOMContentLoaded", function() {
      loadOrders();
      setupEventListeners();
      
      // تحديث تلقائي للطلبات
      onSnapshot(collection(db, "orders"), (snapshot) => {
        loadOrders();
      });
    });
  </script>
</body>
</html>
